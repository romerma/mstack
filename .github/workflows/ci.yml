name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install
      - run: bun run typecheck

      # Both runners, every time. The shim falls back from bun to node, and a
      # `Bun.*` call that slips into src/ would break that fallback silently
      # for anyone without bun. Running only one of these hides it.
      - run: bun test tests/
      - run: node --test 'tests/*.test.ts'

      - run: ./bin/mstack lint-plugin .

      # The shim falls back from bun to node. Prove that branch works on a
      # machine without bun, because that is the machine it exists for.
      - name: The node branch of the launcher
        run: env PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" ./bin/mstack help

      - name: The example repository's own suite
        working-directory: examples/notes-cli
        run: python3 -m unittest discover -s tests -t . -q

  # The launcher claims node 22.6 and newer. A claim nothing runs is a claim,
  # and this plugin is about the difference. --experimental-strip-types is a
  # silent no-op where stripping is already the default, so passing it always
  # widens support down to here rather than narrowing it.
  oldest-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.6"
      # No bun on this runner, so the launcher takes the node branch it exists
      # for. Verified locally on 22.6.0: 112/112, and stderr stays clean because
      # of --disable-warning.
      - run: ./bin/mstack help
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test 'tests/*.test.ts'
